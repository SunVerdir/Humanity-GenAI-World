name: core smoke test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-core-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run core flow smoke test
        run: python tests/test_flow.py
